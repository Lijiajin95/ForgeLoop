name: Deploy

# S2 本机部署：由自托管 runner（标签 forgeloop-deploy）在本机执行。
# 只下载该 Release 上发布的同一份产物，交给**本机已安装**的 forgeloop 部署；
# 不使用长期凭据（公开仓库匿名下载 + runner 自身身份），也不重新构建产物。
#
# 触发路径：
# - 自动：Release 工作流发布后**显式 workflow_dispatch 派发**本工作流
#   （GITHUB_TOKEN 创建的 release 事件不触发下游工作流，不能只靠 release.published）；
# - 人工：在 GitHub 上手动创建 Release（release.published），或手动 workflow_dispatch。
#
# 多项目口径（2026-10-20 起）：业务记录在 `<records-root>/projects/<project_id>/` 下，
# 因此部署必须指定项目；缺省 `forgeloop`（本机登记的项目身份）。部署前置仍按权威记录
# 判定，本工作流只负责执行，不代做批准：
#   1）该标签的发布回执（`forgeloop release` 写入项目记录根）；
#   2）该版本的一次性人工部署批准（`forgeloop deploy-approve --tag … --artifact-sha256 …`
#      在本机执行）。缺任一项时 `deploy` 会 fail-closed 拒绝，本工作流把原因与补办命令
#      一起打印出来，不做任何安装。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 要部署的标签（vX.Y.Z）
        required: true
      project:
        description: 项目身份（业务记录在 <records-root>/projects/<project_id>/ 下）
        required: false
        default: forgeloop
      records-root:
        description: 记录登记根（含 projects.sqlite）
        required: false
        default: /home/link/Project/ForgeLoop/.forgeloop

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  PREFIX: ${{ vars.FORGELOOP_DEPLOY_PREFIX || '/home/link/.local/share/forgeloop' }}
  RECORDS_ROOT: ${{ inputs.records-root || '/home/link/Project/ForgeLoop/.forgeloop' }}
  PROJECT: ${{ inputs.project || 'forgeloop' }}

jobs:
  deploy:
    runs-on: [self-hosted, forgeloop-deploy]
    timeout-minutes: 20
    steps:
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.release.tag_name || inputs.tag }}" >> "$GITHUB_OUTPUT"
      - name: Preflight — installed CLI and project registration
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          cli="${PREFIX}/current/bin/forgeloop"
          if [ ! -x "${cli}" ]; then
            echo "本机尚未安装 forgeloop；请先手动 bootstrap 部署（见 docs/deployment.md）" >&2
            exit 1
          fi
          echo "激活指针: $(readlink "${PREFIX}/current")"
          # 多项目口径需要 CLI 认识 --project；旧版本只会在这一步失败，不会装错记录根。
          if ! "${cli}" deploy --help 2>&1 | grep -q -- '--project'; then
            echo "本机 CLI 不支持多项目部署（缺少 --project）；先升级：" >&2
            echo "  /home/link/Project/ForgeLoop/scripts/install_local_service.sh --no-unit" >&2
            exit 1
          fi
          if ! "${cli}" project show "${PROJECT}" --records-root "${RECORDS_ROOT}" --json >/dev/null 2>&1; then
            echo "项目未登记: ${PROJECT}（记录根 ${RECORDS_ROOT}）" >&2
            echo "先登记项目（一次性）：" >&2
            echo "  ${cli} project add ${PROJECT} --name ForgeLoop --path /home/link/Project/ForgeLoop --records-root ${RECORDS_ROOT}" >&2
            exit 1
          fi
      - name: Deploy with the installed CLI
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          cli="${PREFIX}/current/bin/forgeloop"
          if ! "${cli}" deploy --tag "${TAG}" --project "${PROJECT}" --prefix "${PREFIX}" \
              --records-root "${RECORDS_ROOT}"; then
            echo "部署被拒绝。补办前置后重跑本工作流：" >&2
            echo "  1) 发布回执：forgeloop release <task_id> --tag ${TAG}（记录根 ${RECORDS_ROOT}）" >&2
            echo "  2) 部署批准：forgeloop deploy-approve --tag ${TAG} --artifact-sha256 <sha> --by <身份> --reason <理由> --project ${PROJECT} --records-root ${RECORDS_ROOT}" >&2
            exit 1
          fi
      - name: Verify activation
        run: |
          set -euo pipefail
          "${PREFIX}/current/bin/forgeloop" --help > /dev/null
          echo "激活指针: $(readlink "${PREFIX}/current")"
          tail -n 1 "${PREFIX}/deployments.jsonl"

name: Local full check

# 推送后在 GitHub-hosted Ubuntu runner 上跑全量检查：类型、lint、契约、预算与全部行为测试。
# public 仓库使用 standard GitHub-hosted runner 不按分钟计费；不再依赖本机到 GitHub 的网络。
# 只监听 push，fork 的 pull_request 不进入正式仓库检查。
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-full-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
          cache: npm
      - name: Show toolchain
        run: node --version && npm --version
      - run: npm ci --no-audit --no-fund
      # 全量门禁：make check = 静态检查（类型/lint/契约/预算/断言）+ 全部行为测试。
      - run: make check

name: Engineering quality

# 活动实现是 TypeScript 原生 DSH 插件；CI 只用 Node 与仓库内脚本，不再安装 Python。
# 真实宿主验证（make verify-plugin）需要模型凭据，不在公共 CI 中执行；由本机按
# docs/deployment.md 运行并记录。

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: make check
      - run: make coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-summary
          path: packages/forgeloop/coverage/coverage-summary.json
          retention-days: 7

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
          cache: npm
      - run: npm ci --no-audit --no-fund
      # 依赖漏洞扫描：本机在受限缓存下无法完成，CI 网络环境中执行；失败即阻断。
      # 例外必须登记复查条件，不能静默忽略。
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-logs
          path: .cache/npm-cache/_logs/
          retention-days: 7

  commit-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
      - name: Validate local policy config and audit commit headers
        run: |
          set -euo pipefail
          node scripts/ts/commit-policy.ts --validate-config
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD~1"
          fi
          node scripts/ts/commit-policy.ts --audit "${base}..HEAD"
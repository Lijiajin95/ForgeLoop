name: Engineering quality

# 活动实现是 TypeScript 原生 DSH 插件；CI 只用 Node 与仓库内脚本，不再安装 Python。
# 真实宿主验证（make verify-plugin）需要模型凭据，不在公共 CI 中执行；由本机按
# docs/deployment.md 运行并记录。

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
          cache: npm
      - run: npm ci --no-audit --no-fund
      # 快速 CI：类型/契约/lint/格式 + 不依赖真实构建与多进程的用例。
      - run: make check-fast
      - run: make format

  reliability-advanced:
    # PR 快速进阶门禁：清单/稳定性/属性/状态机/场景/回归 + 增量变异（不做全量变异）。
    # 本机/CI 实测该门禁可能需要超过 25 分钟；给足执行时间，不降低检查范围。
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # 需要 base 与 head 的提交历史来计算 git diff 的增量变异范围。
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Advanced reliability gate
        run: make reliability-advanced
        env:
          FORGELOOP_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reliability-advanced
          path: |
            reports/reliability-advanced.json
            reports/stability.json
            reports/mutation-incremental.json
          if-no-files-found: warn
          retention-days: 14

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
          cache: npm
      - run: npm ci --no-audit --no-fund
      # 宿主装载 E2E：安装与本地运行版本一致的 DSH，再在隔离 profile 中装载插件。
      # DSH 的 `dsh plugin` 会把安装转发给 profile 目录里的 pnpm；runner 默认只有 npm，
      # 缺 pnpm 时 e2e 直接失败（dsh: pnpm was not found）。pnpm 版本与本机一致。
      # 不依赖模型凭据；真实模型链路仍由 make verify-plugin（release workflow）覆盖。
      - run: npm install -g @deepseek-ai/dsh@0.2.1-rc.5 pnpm@12.16.1
      - run: dsh --version && pnpm --version
      - run: make e2e

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
          cache: npm
      - run: npm ci --no-audit --no-fund
      # 依赖漏洞扫描：本机在受限缓存下无法完成，CI 网络环境中执行；失败即阻断。
      # 例外必须登记复查条件，不能静默忽略。
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-logs
          path: .cache/npm-cache/_logs/
          retention-days: 7

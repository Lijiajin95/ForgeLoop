name: Engineering quality
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.24"
          python-version: "3.13"
      - run: uv sync --frozen
      # 一次带覆盖采集的执行跑完高频与集成用例（不再重复跑一遍无覆盖的高频套件），
      # 另加系统测试与全部静态门禁；静态失败即中止作业，退出码照常传播。
      - run: make check-static coverage test-system
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: quality-reports
          path: reports/
          retention-days: 7

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.24"
          python-version: "3.13"
      - run: uv sync --frozen --group security
      - run: make security
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-reports
          path: reports/
          retention-days: 7

  commit-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Audit new commit headers and timestamps
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONPATH: src
        run: |
          set -euo pipefail
          BASE="$EVENT_BASE"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            # 新分支推送时 before 全零：改为只审计该分支相对 main 的新增提交，
            # 不把已在主干的历史提交（含已记录的违规批次）重新判一遍。
            git fetch --quiet origin main
            BASE="$(git merge-base "$HEAD_REVISION" origin/main || true)"
          fi
          python3 scripts/check_commit_policy.py --audit "$BASE" "$HEAD_REVISION"

  dogfood-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # C04 技术门禁：校验受控执行端在合并提交里签发的来源回执。
    # 当前 config/dogfood-policy.toml 的 enabled=false（服务端准入与限定写入身份
    # 尚未验证），作业只报告“待启用”并放行；启用后缺密钥 fail-closed。
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.24"
          python-version: "3.13"
      - run: uv sync --frozen
      - name: Audit DogFood commit provenance
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          FORGELOOP_DOGFOOD_SIGNING_KEY: ${{ secrets.FORGELOOP_DOGFOOD_SIGNING_KEY }}
        run: |
          set -euo pipefail
          BASE="$EVENT_BASE"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            # 新分支推送时 before 全零：只审计该分支相对 main 的新增提交。
            git fetch --quiet origin main
            BASE="$(git merge-base "$HEAD_REVISION" origin/main || true)"
          fi
          .venv/bin/python scripts/check_dogfood_provenance.py --audit "$BASE" "$HEAD_REVISION"

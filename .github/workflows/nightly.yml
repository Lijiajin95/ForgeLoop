name: Nightly quality

# 夜间跑全量质量门禁：全量测试 + 逐文件覆盖率 + 全部源码的变异测试。
# 变异测试按模块分片并行，再由汇总任务合并报告；任何一个分片漏跑或分数低于门槛都会失败。
on:
  schedule:
    - cron: "0 19 * * *" # 19:00 UTC = 03:00 Asia/Shanghai next day
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
          cache: npm
      - run: npm ci --no-audit --no-fund
      # 全量 CI：慢用例 + 逐文件覆盖率门槛；快速 CI 已覆盖的部分重复执行，保证夜间以全量为准。
      - run: make check
      - run: make coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nightly-coverage
          path: packages/forgeloop/coverage/
          retention-days: 14

  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard:
          - domain
          - records
          - runtime-execution
          - runtime-verification
          - runtime-ops
          - session
          - config-agents
          - entry
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
          cache: npm
      - run: npm ci --no-audit --no-fund
      # 分片脚本会先校验全部源码都归属到某个分片，避免新增文件悄悄漏出变异范围。
      - run: make mutation-shard SHARD=${{ matrix.shard }}
        env:
          STRYKER_CONCURRENCY: "4"
      - name: Rename mutation report
        if: always()
        run: mv packages/forgeloop/reports/mutation.json packages/forgeloop/reports/mutation-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mutation-${{ matrix.shard }}
          path: packages/forgeloop/reports/mutation-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 14

  mutation-gate:
    needs: mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mutation-*
          path: packages/forgeloop/reports/shards
          merge-multiple: true
      # 合并报告并再次校验：每个源码文件都必须出现，整体分数不得低于 break 门槛。
      - run: make mutation-merge
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-mutation
          path: packages/forgeloop/reports/mutation.json
          retention-days: 14

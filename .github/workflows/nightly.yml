name: Nightly quality

# 夜间只跑当前已接入的检查。变异测试尚未接入 TypeScript 工具链，不在此伪造通过；
# 缺口记录在 docs/status.md；检查入口与门槛以 Makefile 和 vitest 配置为准。
on:
  schedule:
    - cron: "0 19 * * *" # 19:00 UTC = 03:00 Asia/Shanghai next day
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: make check
      - run: make coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nightly-coverage
          path: packages/forgeloop/coverage/
          retention-days: 14

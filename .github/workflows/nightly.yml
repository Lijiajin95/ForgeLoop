name: Nightly quality

# 夜间跑全量质量门禁：全量测试 + 逐文件覆盖率 + 变异测试。
# 阻断门禁为受控 6 文件变异（break 80，当前 97.58%）；全量 105 文件分片继续运行并上传报告，
# 但标记 continue-on-error 作为趋势证据，不再决定 nightly 成败（全量单分片 2–4 小时，超出作业预算）。
on:
  schedule:
    - cron: "0 19 * * *" # 19:00 UTC = 03:00 Asia/Shanghai next day
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
          cache: npm
      - run: npm ci --no-audit --no-fund
      # 全量 CI：慢用例 + 逐文件覆盖率门槛；快速 CI 已覆盖的部分重复执行，保证夜间以全量为准。
      - run: make check
      - run: make coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nightly-coverage
          path: packages/forgeloop/coverage/
          retention-days: 14

  reliability-advanced:
    # 夜间进阶门禁：更大属性次数、更多稳定性轮次；变异仍由下方全量分片矩阵覆盖。
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: make coverage
      - name: Advanced reliability gate (nightly intensity)
        run: make reliability-advanced
        env:
          FORGELOOP_BASE: ${{ github.event.before }}
          FORGELOOP_PROPERTY_RUNS: "1000"
          FORGELOOP_STABILITY_ROUNDS: "5"
          # 用运行编号作 seed：失败信息会打印 seed，可原样复现；每日覆盖不同样本。
          FORGELOOP_PROPERTY_SEED: ${{ github.run_number }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nightly-reliability-advanced
          path: |
            reports/reliability-advanced.json
            reports/stability.json
            reports/mutation-incremental.json
          if-no-files-found: warn
          retention-days: 14

  mutation:
    runs-on: ubuntu-24.04
    # 全量分片是趋势报告，不阻断 nightly；阻断门禁见 mutation-gate。
    continue-on-error: true
    # 变异使用全量测试（慢用例覆盖 runtime 流水线），单分片按源码大小切分到 14 个作业。
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard:
          - domain-1
          - domain-2
          - records
          - runtime-execution-1
          - runtime-execution-2
          - runtime-verification-1
          - runtime-verification-2
          - runtime-ops-1
          - runtime-ops-2
          - runtime-ops-3
          - runtime-ops-4
          - session
          - config-agents
          - entry
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
          cache: npm
      - run: npm ci --no-audit --no-fund
      # 分片脚本会先校验全部源码都归属到某个分片，避免新增文件悄悄漏出变异范围。
      - run: make mutation-shard SHARD=${{ matrix.shard }}
        env:
          STRYKER_CONCURRENCY: "4"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mutation-${{ matrix.shard }}
          path: packages/forgeloop/reports/mutation-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 14

  mutation-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
          cache: npm
      - run: npm ci --no-audit --no-fund
      # 阻断门禁：受控 6 文件变异必须 ≥80 且关键不变量无存活；当前 97.58%。
      - run: make mutation-incremental SCOPE=controlled
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nightly-mutation-controlled
          path: reports/mutation-incremental.json
          retention-days: 14

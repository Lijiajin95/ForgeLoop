name: Release

# S1 受控发布：标签由 forgeloop release 创建并推送；发布所用的 wheel 必须是 C01 已验收的
# 产物原件——forgeloop release 会把它上传为该标签的草稿 Release 资产，本作业只等待、下载、
# 逐字节核对并发布它，**绝不重新构建**（跨环境重建不可复现，会阻断发布）。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write  # 显式派发 Deploy 工作流（workflow_dispatch 是 GITHUB_TOKEN 的例外）

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify tag matches the project version
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "标签 ${GITHUB_REF_NAME} 与项目版本 v${version} 不一致；拒绝发布" >&2
            exit 1
          fi
      - name: Bind accepted artifact identity
        id: accepted
        run: |
          set -euo pipefail
          # 发布身份来自 C01 已验收产物，写在标签注解里；不凭标签凭空生成发布身份。
          contents="$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")"
          sha="$(printf '%s\n' "${contents}" | sed -n 's/^accepted-artifact-sha256: //p' | head -n1)"
          wheel="$(printf '%s\n' "${contents}" | sed -n 's/^accepted-artifact-wheel: //p' | head -n1)"
          if ! printf '%s' "${sha}" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "标签注解缺少已验收产物校验值；拒绝发布" >&2
            exit 1
          fi
          if ! printf '%s' "${wheel}" | grep -Eq '^forgeloop-[0-9]+\.[0-9]+\.[0-9]+-py3-none-any\.whl$'; then
            echo "标签注解缺少已验收产物文件名；拒绝发布" >&2
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "wheel=${wheel}" >> "$GITHUB_OUTPUT"
      - name: Wait for the accepted artifact asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 产物原件由 forgeloop release 上传为草稿 Release 资产；这里等待它出现，
          # 不重新构建。超时即失败并如实报告，避免发布身份漂移。
          wheel="${{ steps.accepted.outputs.wheel }}"
          for attempt in $(seq 1 60); do
            if gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' 2>/dev/null \
                | grep -Fxq "${wheel}"; then
              echo "已找到已验收产物资产：${wheel}"
              exit 0
            fi
            sleep 5
          done
          echo "等待已验收产物资产超时：${wheel}；拒绝在标签工作流重新构建" >&2
          exit 1
      - name: Download and verify the accepted artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 只下载 C01 已验收产物原件并逐字节核对；不一致立即失败，不重建。
          mkdir -p dist
          gh release download "${GITHUB_REF_NAME}" \
            --pattern "${{ steps.accepted.outputs.wheel }}" --dir dist --clobber
          actual="$(sha256sum "dist/${{ steps.accepted.outputs.wheel }}" | cut -d' ' -f1)"
          if [ "${actual}" != "${{ steps.accepted.outputs.sha }}" ]; then
            echo "Release 产物与已验收产物不一致：下载 ${actual}，验收 ${{ steps.accepted.outputs.sha }}；拒绝发布" >&2
            exit 1
          fi
      - name: Write checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 重试不制造新发布身份：只把草稿发布出去；已有 Release 只补校验清单（--clobber），
          # 不新建 Release，也不改标签指向。
          if [ "$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft')" = "true" ]; then
            gh release edit "${GITHUB_REF_NAME}" --draft=false --verify-tag
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
      - name: Trigger deploy workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN 创建的 release 事件不会触发下游工作流（仅 workflow_dispatch /
          # repository_dispatch 例外），因此这里显式派发 Deploy；失败即本作业失败。
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}" -f tag="${GITHUB_REF_NAME}"

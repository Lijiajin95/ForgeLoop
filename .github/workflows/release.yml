name: Release

# S1 受控发布：标签已由 forgeloop release 创建并推送（含发布回执），
# 本作业只从标签构建一次产物并附校验值，供本机部署核对"同一份验收产物"。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write  # 显式派发 Deploy 工作流（workflow_dispatch 是 GITHUB_TOKEN 的例外）

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.24"
          python-version: "3.13"
      - name: Verify tag matches the project version
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "标签 ${GITHUB_REF_NAME} 与项目版本 v${version} 不一致；拒绝发布" >&2
            exit 1
          fi
      - name: Build distribution
        run: uv build
      - name: Write checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
      - name: Trigger deploy workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN 创建的 release 事件不会触发下游工作流（仅 workflow_dispatch /
          # repository_dispatch 例外），因此这里显式派发 Deploy；失败即本作业失败。
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}" -f tag="${GITHUB_REF_NAME}"

schema_version = 1

# DogFood 提交来源策略（C04）。
#
# 受控执行端（`forgeloop merge`）在生成合并提交时，用本文件指定的密钥对来源回执
# 签名；回执作为提交消息 trailer `ForgeLoop-Provenance` 随提交传递。可信校验端
# `scripts/check_dogfood_provenance.py` 在 CI 中验证签名与内容，拒绝普通直接提交、
# 补挂任务 ID、内容漂移与非授权更新。
#
# 当前状态：**待启用**。技术门禁与负例已实现（tests/unit/test_dogfood_provenance.py、
# tests/scenario/test_dogfood_gate.py），但服务端准入（仓库 ruleset 的 required
# status checks 与限定写入身份）尚未执行，历史提交也尚无回执。因此先保持
# `enabled = false`，由所有者完成服务端验证后，在专用验证分支按批启用；
# 见 docs/branch-protection.md。

enabled = false

# 签名密钥从环境变量读取，绝不写入仓库。该变量只存在于受控执行端与可信校验端，
# 不得传入 PI（实现端）执行环境。策略启用而密钥缺失时门禁 fail-closed（拒绝放行）。
signing_key_env = "FORGELOOP_DOGFOOD_SIGNING_KEY"

# 合并提交消息中的回执 trailer 名。
trailer_name = "ForgeLoop-Provenance"

# 受控任务 ID 前缀：不属于该前缀的任务 ID 即使带回执也拒绝（拒绝补挂）。
task_id_prefix = "task-"

# 回执必须携带且通过校验的字段；缺一即拒绝。
required_fields = [
  "schema",
  "task_id",
  "requirement_id",
  "plan_version",
  "baseline_commit",
  "candidate_sha256",
  "test_evidence_sha256",
  "review_sha256",
  "approval_fingerprint",
]

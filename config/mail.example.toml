# ForgeLoop 邮件配置模板（不含真实值）。
#
# 使用方式：
#   cp config/mail.example.toml config/mail.toml
# 然后填写 sender/recipient，并按需要调整 provider 等字段。
# 不要把真实账号或口令提交进仓库；也可把配置放在仓库外，
# 再用 --config <路径> 或 FORGELOOP_MAIL_CONFIG=<路径> 指定。
#
# 邮箱口令不写在这里：请单独创建权限为 600 的口令文件，
# 候选顺序与创建命令见 docs/architecture.md 的 mail 层说明。
# provider 首版支持 qq、gmail。

provider = "qq"
sender = "your-account@example.com"
recipient = "notify-to@example.com"

# 可选字段：不写则使用默认值。
subject_prefix = "[ForgeLoop]"
folder = "INBOX"
whitelist = ["notify-from@example.com"]
# auto_analyze = true 时，轮询登记的**新**入向邮件会让对应需求自动跑一次分析
# （需要同时给 mail poll 传 --pi-command；缺省关闭，因为分析要花模型调用）。
auto_analyze = false

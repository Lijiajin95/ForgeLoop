schema_version = 1

# ForgeLoop 工程可靠性方案的唯一门槛来源，复刻自 EvidHist。
# 结构、覆盖、变异与属性测试门槛由 scripts/check_*.py 专用脚本消费；
# Ruff、Pylint 等工具不识别本文件。所有门槛在代码落地前均未执行。

[scope]
# 手写源码范围同时登记 Python 与前端；本文件的结构报告只统计 .py（口径见
# scripts/check_structure_metrics.py），TS/TSX 的结构数值由 [frontend] 段与
# ESLint 执行，两者不重复阻断同一个数字。
handwritten_roots = ["src", "scripts", "tests", "frontend/src", "frontend/tests"]
extensions = [".py", ".ts", ".tsx"]
generated_roots = ["src/forgeloop/cli/static"]

[structure]
# 结构数字全部是**审阅提示**（2026-10-13 精简，见可靠性方案第 25 节）：
# warn/max 只决定报告中的可见程度（hint / review），不阻断交付；
# 只有配置损坏、源码读取或解析失败才让 check_structure_metrics.py 失败。
# 不为数字超限拆函数、拆文件或增加抽象层。
function_effective_lines_warn = 40
function_effective_lines_max = 50
exclude_blank_lines = true
exclude_comment_only_lines = true
exclude_python_docstrings = true
include_signature = true
include_nested_function_ranges = true
public_interfaces_warn = 10
public_interfaces_max = 20
public_interface_mode = "own-methods-and-properties"
file_physical_lines_warn = 300
file_physical_lines_max = 500
reviewed_file_exception_ceiling = 1000
reviewed_exceptions = []

# 审阅提示上限（不阻断）：超过即出现在结构报告与 stdout 的 HINT 行，
# 供人工判断是否需要处理。复杂度/分支数在此统一报告（Ruff 的 C901、
# PLR0912、PLR0913 已停用，Pylint 的接口数与文件长度检查也已并入本报告），
# 避免同一个数字被两处门禁重复阻断。口径见 scripts/structure_metrics.py。
[structure.review_hints]
return_statements_max = 6
statements_max = 50
local_variables_max = 15
complexity_max = 10
parameters_max = 5
branches_max = 12

[frontend]
# 前端（TypeScript）门槛：数值与 Python 同表，来源见 docs/engineering-reliability.md
# 第 1 节与 EvidHist coding-agent-handoff 第 11.1 节。ESLint / Vitest / Stryker 读
# frontend/quality-thresholds.json；本段是唯一来源，scripts/check_frontend_policy.py
# 机器核对两者一致（含口径标志）。
#
# 结构数值与 Python 结构报告同为**审阅提示**（ESLint `warn`）：make frontend-check
# 不把 warning 当失败；正确性、类型、格式、依赖边界与死代码仍为硬门禁。
function_lines_max = 50
file_lines_max = 500
complexity_max = 10
depth_max = 4
params_max = 5
statements_max = 50
exclude_blank_lines = true
exclude_comment_only_lines = true

# 覆盖与变异门槛（前端）：Vitest 覆盖率与 Stryker 的 break 阈值。
coverage_line_min = 90
coverage_branch_min = 90
coverage_function_min = 90
coverage_statement_min = 90
mutation_killed_min = 90

# 前端变异幸存者逐项审阅（2026-10-17 实跑 213 个变异体后审阅）。
# 键为 `文件:行:列:变异算子:替换内容`；同一位置的多个等价变异由一条登记覆盖。
# 未登记的幸存者会让 scripts/check_frontend_mutation.py 失败；条目过期只作提示。
[[frontend.reviewed_survivors]]
mutant = 'src/format.ts:46:19:ConditionalExpression:false'
reason = "等价变异：Number(数字) 与数字本身恒等，`typeof value === \"number\"` 的三元分支只影响同一结果的路径。"

[[frontend.reviewed_survivors]]
mutant = 'src/format.ts:46:36:StringLiteral:""'
reason = "等价变异：`typeof value === \"\"` 恒为假，退化为 Number(value)，与上一行同一结果。"

[[frontend.reviewed_survivors]]
mutant = 'src/format.ts:68:41:ObjectLiteral:{}'
reason = "本机 ICU 下 zh-CN 的默认 hour12 与显式 false 相同（实测输出一致）；测试已钉死 24 小时制形状，跨 ICU 行为差异由真实浏览器用例间接覆盖。"

[[frontend.reviewed_survivors]]
mutant = 'src/progress.ts:36:10:ConditionalExpression:true'
reason = "等价变异：isRecord 判定的放宽只改变进入分支的路径，非对象响应体在 try/catch 后仍落到同一 `HTTP <status>` 兜底文案。"

[[frontend.reviewed_survivors]]
mutant = 'src/progress.ts:36:10:LogicalOperator:typeof value === "object" || value !== null'
reason = "等价变异：`||` 版本对 null 响应体会抛 TypeError，但同样被 errorDetail 的 try/catch 收敛为 `HTTP <status>`，可观察结果不变。"

[[frontend.reviewed_survivors]]
mutant = 'src/progress.ts:36:39:ConditionalExpression:true'
reason = "等价变异：`value !== null` 恒真时，null 响应体走 `payload.detail` 抛错并被 try/catch 吞掉，兜底文案相同。"

[[frontend.reviewed_survivors]]
mutant = 'src/progress.ts:161:27:ConditionalExpression:false'
reason = "等价变异：refresh_seconds 为 0 时 tick() 在 autoRefreshOff 分支提前返回，nextRefreshAt 的取值不会被读取。"

[[frontend.reviewed_survivors]]
mutant = 'src/progress.ts:161:27:EqualityOperator:seconds < 0'
reason = "等价变异：同上，seconds 为 0 时该赋值的两种取值都不可观察。"

[coverage]
line_min = 90
branch_min = 90
changed_line_min = 90

[mutation]
general_killed_min = 90
critical_unreviewed_survivors_max = 0
unresolved_incomplete_states_max = 0
require_nonempty_report = true

# 变异范围为 pyproject.toml 的 [tool.mutmut].only_mutate 九项核心领域规则；
# 2026-10-14 已把 domain/status.py 纳入（实测变异体全部被杀死、无 no tests）。
# requirement／task_plan／artifact 暂不纳入：同日用 unit+property 选择实测这 3 个
# 模块合计 385 个非杀死（幸存 171＋no tests 214，序列化与候选身份等仅由场景／
# 系统层覆盖），会触发上面的 0 未完成状态门槛；补齐覆盖并重新审阅幸存者后
# 再加入，见可靠性方案第 26 节。现有范围内 `domain/release.py` 的
# check_release_artifact／check_release_retry 无 unit/property 覆盖（63 个
# no tests），`domain/merge.py` 另有 8 个未审阅幸存者，故 **make mutation 当前
# 为红**；修复需补测试与重导清单，同见第 26 节。



timezone = "Asia/Shanghai"
calendar_directory = "config/workday-calendars"

# 所有者决定（2026-10-13）：禁止窗口调整为两段，午间 12:00–13:30 可用于提交。
# 窗口为当日区间，起点含、终点不含；多段必须按起点有序且互不重叠。
[[blocked_windows]]
start = "09:00"
end = "12:00"

[[blocked_windows]]
start = "13:30"
end = "18:00"

# 所有者决定（2026-10-13，同日第二项）：授权提交只保留早间窄口。
# 起点含、终点不含；必须完全落在某段禁止窗口内，终点不得晚于 10:00（领域硬上限）。
[authorized_window]
start = "09:00"
end = "09:55"

# 所有者按批次明确授权的日期：一次授权登记一条，必须写清授权来源。
# 未登记的日期即使落在窄口内也拒绝；已登记但超出窄口（09:55 起、午间之外、
# 下午 13:30–18:00）同样拒绝——超过 10:00 授权也不再允许提交。
[[authorized_batches]]
date = "2026-10-13"
authorization_source = "所有者授权 S1–S3 批次（当日 09:22–09:42 提交 f35ff0c/0f4aa3b/f28635c/bb91b6f/68f4c13，临时策略修订路径）；10:34–10:37 的 4 个提交不在授权内，仍记违规"

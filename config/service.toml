# 常驻服务配置（R2）：监听地址、心跳间隔、并发上限、自动接续开关与项目档案。
#
# 数值规则在 domain.service：非法值（非回环 host、坏端口、poll_seconds < 1、用布尔冒充
# 整数等）一律启动失败，不静默回落到默认值；命令行 --host/--port 覆盖本文件。
#
# auto_advance 是**自动接续**开关：
# - false（默认）：常驻进程只提供只读状态页与状态接口，不自动推进任何需求（页面显式
#   推进入口属 R3）；
# - true：worker 按 poll_seconds 扫描权威记录，把「项目已配置、任务包已批准、下一步主体
#   是 agent、PI HOME 与进程 HOME 一致」的需求交给既有编排自动推进；批准/验收/停止/
#   失败累计/槽位互斥全部沿用既有规则，常驻进程不代替所有者做任何验收。
#
# PI HOME 前提：宿主模式下 PI 子进程继承常驻进程的环境，因此只有 pi_home 与进程 HOME
# 一致的项目会被执行（不一致的项目在状态文档里如实跳过并给出原因）。pi_home 必须含
# 非空的 .pi/agent/models.json（工程可靠性方案第 22.2 节），否则拒绝启动。
#
# 没有 [projects.<名字>] 条目时，常驻服务只提供只读页面与状态接口，不执行任何任务。

# [projects.forgeloop]
# path = "/home/link/Project/ForgeLoop"
# pi_command = ["pi", "--mode", "rpc", "--no-session", "--provider", "cc-switch-open-code-go", "--model", "deepseek-v4.1-flash"]
# test_command = ["uv", "run", "pytest", "-q", "tests/unit", "tests/property"]
# baseline = ""
# pi_home = "/home/link/.local/share/forgeloop/pi-home"

schema_version = 1
host = "127.0.0.1"
port = 8712
poll_seconds = 2
max_concurrent = 2
auto_advance = false

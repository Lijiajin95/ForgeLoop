[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "forgeloop"
version = "0.0.3"
description = "CLI-driven automated development loop: bounded small requirements to accepted code diffs"
readme = "README.md"
# Python 3.13 是骨架提案基线：须在最小技术方案核查中与 LangGraph、PI RPC 容器
# 实际兼容性一起验证后固定（EvidHist 基线为 3.14.8，经其工具链验证）。
requires-python = ">=3.13,<3.14"

# 版本区间均为提案值：最小技术方案核查时以实际解析结果固定并生成 uv.lock。
dependencies = [
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  # 直接导入 RunnableConfig（CLI 运行配置类型），按 deptry 纪律显式声明。
  "langchain-core>=1,<2",
]

[project.scripts]
forgeloop = "forgeloop.cli:main"

[dependency-groups]
dev = [
  "uv==0.12.24",
  "hypothesis>=6.125,<7",
  "pre-commit>=4.4,<5",
  "pyright>=1.1.400,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "pytest-timeout>=2.4,<3",
  "pylint>=4.1,<5",
  "import-linter>=2.15,<3",
  "deptry>=0.25,<1",
  "ruff>=0.14,<1",
  "certifi>=2026.7.22,<2027",
  "diff-cover>=9,<10",
]
mutation = ["mutmut>=3.8,<4"]
security = ["pip-audit>=2.9,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/forgeloop"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["mutants", ".cache"]

[tool.ruff.lint]
# 结构数字（复杂度、参数数、分支数）自 2026-10-13 起由结构报告给出审阅提示，
# 不再作为 Ruff 硬阻断：见 config/quality-policy.toml 与可靠性方案第 25 节。
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "RUF",
  # 安全子集（2026-10-16）：不整体启用 S（bandit），只精确选取与本项目真实
  # 风险面相关的 7 条，替代已移除的 Semgrep 本地规则。整体启用会一次性引入
  # 大量与本工具无关的告警，故逐条登记；新增/删除须同步安全门禁与测试。
  "S102",
  "S301",
  "S307",
  "S501",
  "S506",
  "S602",
  "S605",
]
allowed-confusables = ["，", "：", "；", "。", "（", "）"]

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["mutants", ".cache", ".venv"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
# 严格模式覆盖无框架依赖的模块；graph/cli 是 LangGraph 的类型边界
# （框架 API 返回大量 Any），用 basic 模式避免与框架缠斗。
strict = ["src/forgeloop/domain", "src/forgeloop/records", "src/forgeloop/adapter"]
reportUnnecessaryTypeIgnoreComment = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --import-mode=importlib -ra"
timeout = 30
timeout_method = "signal"
markers = [
  "integration: requires the local persistence boundary (SQLite checkpointer files or the restricted container)",
  "system: requires a running CLI process with real local records",
  "scenario: deterministic multi-step workflow behavior",
  "component: CLI output contract tests driven through command entry points",
  "pi_live: real PI RPC invocation in the restricted container (explicit opt-in)",
  "dsh_live: real DSH headless invocation with a real model (explicit opt-in)",
  "install: 真实执行 uv venv 与 wheel 安装的慢速用例（make test-install，预算 180s）",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["forgeloop"]
omit = ["src/forgeloop/__init__.py", "src/forgeloop/domain/__init__.py"]

[tool.mutmut]
source_paths = ["src/forgeloop/"]
# 核心领域范围：失败轮次计数、追加授权、批准绑定、时间限额、提交策略、
# 受控归并（含 S3 必需检查判定）、受控发布与受控部署规则。
# 避免对框架启动、第三方代码和全部 I/O 进行变异（架构文档 §7 同款边界）。
# 新纯规则模块的纳入情况（2026-10-14 实测）：`domain/status.py` 已纳入，
# 其变异体在 unit+property 选择下全部被杀死、无 no tests。`requirement`／
# `task_plan`／`artifact` **暂不纳入**：三个模块实测合计 385 个非杀死
# （幸存 171＋no tests 214，序列化、ID 分配、候选构建身份等仅由场景／系统层
# 覆盖），而 unresolved_incomplete_states_max=0 会直接判失败；补齐覆盖并重新
# 审阅幸存者后再加入，见可靠性方案第 26 节。
# `domain/service.py`（R1 常驻配置纯规则）**已纳入**（2026-10-18 所有者决定）：该模块
# 的代码几乎全是校验分支，可观察差异主要落在错误消息上，因此对**本模块**取「消息即契约」
# 口径——`tests/unit/test_service_config.py::TestMessagesAreTheContract` 逐字断言文案
# （字段名、范围写法 1..65535／>= 1、未知键清单与分隔符），把消息变异钉死。这是对既有
# 「消息内容非行为契约」先例的**收紧例外**，只适用于配置校验这类「文案就是运维界面」的
# 模块；其余模块的登记先例不变。剩下的不可杀死变异是 `cast("...")` 实参（运行时 no-op，
# 天然等价），逐条登记在 config/quality-policy.toml 的 [[mutation.reviewed_survivors]]。
# 注意（2026-10-18 实测）：`mutants/` 只在**首次**创建时整体拷贝，之后同一目录里的
# 测试与包数据不会随工作区刷新。本地改过 tests/、页面 HTML 或 static/*.js 后必须
# `rm -rf mutants` 再跑，否则会拿到陈旧夹具的结论（实测：改测试后重跑数字不变；
# 页面 HTML 陈旧直接让基线失败）。CI 与夜间作业是干净检出，不受影响。
# `domain/mail_interaction.py`（2026-10-19 新增）同样**暂不纳入**：纯协议规则已由
# unit 用例覆盖（100% 行／分支），但尚未实测变异幸存者与 no tests 并逐条审阅；
# 在补齐前加入会让夜间作业因未审阅项失败。
only_mutate = [
  "src/forgeloop/domain/agent_runtime.py",
  "src/forgeloop/domain/counting.py",
  "src/forgeloop/domain/approval.py",
  "src/forgeloop/domain/delivery.py",
  "src/forgeloop/domain/limits.py",
  "src/forgeloop/domain/commit_policy.py",
  "src/forgeloop/domain/merge.py",
  "src/forgeloop/domain/release.py",
  "src/forgeloop/domain/deploy.py",
  "src/forgeloop/domain/status.py",
  # 2026-10-18 所有者决定纳入：配置校验模块的**消息即契约**（运维照着改配置），
  # 因此为它逐字断言文案，而不是按其他模块的先例把消息变异登记为「非契约」。
  # 实测 254 个变异体：242 杀死 / 12 存活（95.3%），存活全部是 cast(...) 等价变异。
  "src/forgeloop/domain/service.py",
]
pytest_add_cli_args_test_selection = ["tests/unit/", "tests/property/"]
pytest_add_cli_args = [
  "--import-mode=importlib",
  "-o",
  "addopts=",
  # 架构契约门禁是仓库结构检查（依赖 contracts/ 与 docs/，不在 mutants 副本内），
  # 与核心领域规则的变异判定无关：排除以免基线收集失败。
  # 变异基线只跑 unit+property（与上面的 test_selection 同口径）：系统层要起真实进程
  # 与回环端口，在沙箱里会撞 pytest-timeout（2026-10-18 实测：基线跑到
  # tests/system/test_serve_async.py 超时，整个运行报 failed to collect stats）；
  # 集成层同理不属于「变异由稳定单元测试判定」的范围。
  "--ignore=tests/system",
  "--ignore=tests/integration",
  "--ignore=tests/unit/test_architecture_contract.py",
  # 下面三个属性用例用 Hypothesis + 函数级 fixture（tmp_path），在 mutmut 的多执行器
  # 基线下触发 HealthCheck.differing_executors——Hypothesis 明确说这是测试正确性问题、
  # 不建议压制；它们覆盖的模块（prereq_apply／槽位残留／续跑记录）都不在 only_mutate
  # 范围内，排除不影响变异判定（2026-10-18 实测：修好前两个基线失败后才暴露）。
  "--ignore=tests/property/test_prereq_apply_idempotent.py",
  "--ignore=tests/property/test_slot_residue.py",
  "--ignore=tests/property/test_requirement_retry_property.py",
]
# 前端随包模块与门槛文件要一并复制：tests/unit/test_web_page.py（跨语言契约）与
# tests/unit/test_frontend_gates.py（门槛一致性）会读 frontend/src/*.ts 与
# frontend/quality-thresholds.json；不复制就会在基线收集阶段 FileNotFoundError
# （2026-10-18 实测：修好 planning-repo-facts 的跳过后它们成为 mutmut 的首个失败）。
# 目录项先于文件项，保证 mutants/frontend/ 已存在。
# `contracts/` 必须一并复制（2026-10-18 实测）：`tests/component/test_cli_contract.py` 会读
# `contracts/cli-contract.json`，沙箱里没有它就基线失败——扩大 only_mutate 后这条暴露出来
# （此前只在跑窄范围时才没被选中）。契约快照是仓库结构检查，与变异判定无关，但缺了会直接
# 让整个变异运行报「failed to collect stats」。
also_copy = ["tests", "config", "scripts", "contracts", "frontend/src", "frontend/quality-thresholds.json"]

[tool.pylint.main]
# Pylint 原先只启用 too-many-public-methods 与 too-many-lines 两项；
# 这两项与结构报告重复，2026-10-13 起统一由 check_structure_metrics.py 作为
# 审阅提示报告（可靠性方案第 25 节）。Pylint 依赖保留在 dev 组以免 uv.lock 漂移，
# 不再作为 make check 的门禁。
disable = ["all"]

[tool.importlinter]
root_package = "forgeloop"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain must not depend on orchestration, adapters or the CLI"
type = "forbidden"
source_modules = ["forgeloop.domain"]
forbidden_modules = ["forgeloop.cli", "forgeloop.graph", "forgeloop.adapter", "langgraph"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "Mail must not depend on the CLI, graph, records, adapters or LangGraph"
type = "forbidden"
source_modules = ["forgeloop.mail"]
forbidden_modules = [
  "forgeloop.cli",
  "forgeloop.graph",
  "forgeloop.records",
  "forgeloop.adapter",
  "langgraph",
]
allow_indirect_imports = false

[tool.deptry]
extend_exclude = ["mutants", "\\.cache", "\\.toolchain", "\\.venv"]
known_first_party = ["forgeloop", "structure_metrics"]

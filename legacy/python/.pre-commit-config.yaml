default_install_hook_types: [pre-commit, pre-push, commit-msg]
repos:
  - repo: local
    hooks:
      - id: commit-work-hours
        name: Commit time restriction from the local policy config
        language: unsupported
        # 生效配置不入库（模板 config/commit-policy.template.toml）：本机没装配置时
        # 本钩子放行并打印 policy_absent / NOT enforced；配置损坏或未迁移时拒绝。
        entry: .venv/bin/python scripts/check_commit_policy.py --check-now
        always_run: true
        pass_filenames: false
        stages: [pre-commit, commit-msg]
      - id: conventional-commit-message
        name: Conventional Commit header
        language: unsupported
        entry: .venv/bin/python scripts/check_commit_policy.py --message
        stages: [commit-msg]
      - id: ruff-check
        name: Ruff lint
        language: unsupported
        entry: .venv/bin/ruff check --force-exclude
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        language: unsupported
        entry: .venv/bin/ruff format --check --force-exclude
        types_or: [python, pyi]
      - id: pyright
        name: Pyright project types
        language: unsupported
        entry: .venv/bin/pyright
        pass_filenames: false
        types_or: [python, pyi]
      - id: frontend-check
        name: Frontend lint, types, boundaries before push
        language: unsupported
        # 前端门禁：格式、ESLint、tsc、产物漂移、模块边界与死代码、jsdom 用例
        # （真实浏览器用例与变异分别属 CI/夜间层，见 docs/engineering-reliability.md）。
        entry: make frontend-check
        pass_filenames: false
        stages: [pre-push, manual]
        files: ^frontend/|^src/forgeloop/cli/(web_page\.html|static/)
      - id: fast-tests
        name: Deterministic tests before push
        language: unsupported
        # 高频层：不含真实安装用例（部署属低频，见 Makefile 的 test-install 与夜间作业）。
        #
        # 先用 `env -u` 清掉 git 向钩子导出的仓库定位变量，再跑测试。git 在执行 pre-push
        # 钩子时会导出 GIT_DIR／GIT_INDEX_FILE 等；这些变量会被测试进程继承，于是测试里为
        # 临时仓库启动的 git 子进程会**命中真实仓库**——2026-10-19 实测：带 GIT_DIR 跑
        # `tests/scenario/test_self_iteration.py` 是 21/23 失败（正常环境 23/23 通过），
        # 且仓库 HEAD／索引被测试的 checkout／reset 改到别的提交上。同源事故记录见
        # docs/status.md 的「.git/config 被覆盖事故」。
        entry: env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_WORK_TREE -u GIT_PREFIX -u GIT_COMMON_DIR
          -u GIT_OBJECT_DIRECTORY -u GIT_ALTERNATE_OBJECT_DIRECTORIES .venv/bin/pytest tests/unit
          tests/property tests/component tests/scenario -m "not install" -q
        pass_filenames: false
        stages: [pre-push, manual]
        types_or: [python, pyi]
